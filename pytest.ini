[pytest]
addopts = -m "not integration and not gpu and not opcua and not industrial-e2e"
markers =
    unit: pure unit tests, no external dependencies
    integration: requires live services (PostgreSQL, HTTP simulators)
    opcua: requires the local OPC UA PLC simulator (8503); Phase 7 gate, fail-fast (never skip)
    industrial-e2e: full industrial closed-loop chain with live simulators (human review -> PLC -> MES)
    industrial_e2e: alias of industrial-e2e (pytest attribute spelling)
    gpu: requires a CUDA-capable GPU
    artifact: requires local model artifact files (best.pt / patchcore bank.npz); local integration gate (CI excludes it explicitly, never silently skipped)
testpaths = backend/tests inference-service/tests
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
