name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  AI_MODE: mock

jobs:
  backend-lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[dev]"
        working-directory: apps/api
      - run: make backend-lint-typecheck

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vision_qc_test
          POSTGRES_USER: vision_qc
          POSTGRES_PASSWORD: vision_qc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vision_qc -d vision_qc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      CELERY_TASK_ALWAYS_EAGER: "true"
      DATABASE_URL: postgresql+asyncpg://vision_qc:vision_qc@localhost:5432/vision_qc_test
      REDIS_URL: redis://localhost:6379/0
      UPLOAD_DIR: ./test-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[dev]"
        working-directory: apps/api
      - name: Verify Redis
        run: python -c "from redis import Redis; assert Redis.from_url('redis://localhost:6379/0').ping()"
        working-directory: apps/api
      - name: Run migrations
        run: alembic upgrade head
        working-directory: apps/api
      - run: make backend-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: apps/api/coverage.xml
          if-no-files-found: error

  frontend-lint-typecheck-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: make frontend-lint-typecheck-tests
      - run: npm audit --omit=dev --audit-level=high
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: apps/web/coverage
          if-no-files-found: error

  frontend-build:
    runs-on: ubuntu-latest
    needs: frontend-lint-typecheck-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: make frontend-build

  docker-compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CELERY_TASK_ALWAYS_EAGER: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Start services
        run: docker compose up -d
      - name: Wait for healthy services
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8000/health >/dev/null &&
               curl --fail --silent http://localhost:8000/ready >/dev/null &&
               curl --fail --silent http://localhost:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Services did not become healthy in time"
          exit 1
      - name: Run minimal persisted closed loop
        run: |
          response="$(curl --fail --silent \
            -H 'Idempotency-Key: docker-smoke-pass-001' \
            -F 'product_code=DOCKER-SMOKE' \
            -F 'batch_code=CI' \
            -F 'image=@sample-data/mock-pass.png;type=image/png' \
            http://localhost:8000/api/v1/inspections)"
          inspection_id="$(python -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<<"$response")"
          for attempt in {1..30}; do
            detail="$(curl --fail --silent "http://localhost:8000/api/v1/inspections/$inspection_id")"
            status="$(python -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$detail")"
            if [ "$status" = "completed" ]; then
              python -c 'import json,sys; data=json.load(sys.stdin); assert data["disposition"]=="release"; assert any(a["action_type"]=="release_product" for a in data["actions"])' <<<"$detail"
              exit 0
            fi
            sleep 1
          done
          echo "Inspection did not complete"
          exit 1
      - name: Print logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Save Compose logs
        if: always()
        run: docker compose logs --no-color > docker-compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-compose-logs
          path: docker-compose.log
          if-no-files-found: warn
      - name: Stop services
        if: always()
        run: docker compose down -v --remove-orphans

  e2e:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: pip install -e ".[dev]"
        working-directory: apps/api
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: make e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: warn
