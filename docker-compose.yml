services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vision_qc
      POSTGRES_USER: vision_qc
      POSTGRES_PASSWORD: vision_qc
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vision_qc"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
